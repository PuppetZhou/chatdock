[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatdock"
version = "0.2.0"
description = "ChatDock — local Linux agent session inspector and terminal dashboard"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
tui = ["textual>=1.0,<2"]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
chatdock = "agentdeck.cli:main"
chat-monitor = "agentdeck.cli:main"
codex-status = "agentdeck.cli:main"
agent-deck = "agentdeck.tui:main"

[tool.setuptools.packages.find]
include = ["agentdeck*"]

[tool.setuptools.package-data]
agentdeck = ["*.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
